services:
  angel-chat:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: production
      ADMIN_NICK: ${ADMIN_NICK:-xergno}
      ADMIN_PASS: ${ADMIN_PASS:?Define ADMIN_PASS in .env}
      GATE_PASS: ${GATE_PASS:?Define GATE_PASS in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - angel-chat-data:/app/data

volumes:
  angel-chat-data:
